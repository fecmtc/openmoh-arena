##########################
#
# Added in MoH Arena
#
# The Windows x64 build of the mohaa-reloaded branch, with the MoH Arena
# native bridge: MoHAA-Reloaded's Vulkan renderer linked into the exe (so
# the hash the launcher checks covers it), SDL3 and OpenAL Soft (loaded when
# the game runs, s_backend openal). The same toolchain as
# moharena-windows.yml and shared-build-windows.yml. No modern UI (it is
# compiled out on this branch), no installer, no Rust launcher and no test
# programs.
#
##########################
name: "MoH Arena Reloaded Windows Build"

on:
  workflow_dispatch:
  push:
    branches:
      - 'mohaa-reloaded'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}

jobs:
  build:
    name: "MoH Arena Reloaded windows-x64"
    runs-on: windows-2025
    env:
        flexbison-branch: 'v2.5.25'
        openal-soft-branch: '1.24.3'
        sdl3-branch: 'release-3.4.18'
        vulkan-headers-version: 'v1.4.341'

    steps:
    ###
    # Packages
    ###

    - name: Cache Flex/Bison
      id: cache-flexbison
      uses: actions/cache@v4
      with:
        path: 'thirdparties/winflexbison-install'
        key: ${{ runner.os }}-x64-flexbison-${{ env.flexbison-branch }}-v2

    - name: Install Flex/Bison
      if: steps.cache-flexbison.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}
      run: |
        mkdir thirdparties && cd thirdparties
        git clone --depth 1 --single-branch --branch ${{ env.flexbison-branch }} https://github.com/lexxmark/winflexbison.git
        cmake -B winflexbison-build -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/winflexbison-install' -DCMAKE_POLICY_VERSION_MINIMUM="3.5" ./winflexbison
        cmake --build winflexbison-build --config Release --parallel
        cmake --install winflexbison-build --config Release

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $env:GITHUB_ENV
        echo "CC=cl.exe" >> $env:GITHUB_ENV
        echo "CXX=cl.exe" >> $env:GITHUB_ENV
        pushd "$($env:PROGRAMFILES)\Microsoft Visual Studio\*\*\VC\Auxiliary\Build"
        cmd /c "vcvarsall.bat x64 & set" | ForEach-Object {
          if ($_ -match "=") {
            # Split into key=value
            $var = $_.split("=", 2);
            echo "$($var[0])=$($var[1])" >> $env:GITHUB_ENV
          }
        }
        popd

    - name: Cache Required Packages
      id: cache-required-packages
      uses: actions/cache@v4
      with:
        path: 'C:\Packages'
        key: ${{ runner.os }}-x64-required-packages-v1

    - name: Install required packages
      if: steps.cache-required-packages.outputs.cache-hit != 'true'
      run: |
        $DownloadPath="$($env:USERPROFILE)\Downloads"
        Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip" -OutFile "$DownloadPath\ninja-win.zip"
        Expand-Archive -Path "$DownloadPath\ninja-win.zip" -DestinationPath "C:\Packages\ninja"
        Invoke-WebRequest "https://download.qt.io/official_releases/jom/jom.zip" -OutFile "$DownloadPath\jom.zip"
        Expand-Archive -Path "$DownloadPath\jom.zip" -DestinationPath "C:\Packages\jom"

    - name: Setup required packages path
      run: |
        $env:PATH += ";C:\Packages\ninja;C:\Packages\jom;"
        echo "PATH=$($env:PATH)" >> $env:GITHUB_ENV

    ###
    # SDL3
    ###

    - name: Cache SDL3
      id: cache-sdl3
      uses: actions/cache@v4
      with:
        path: 'thirdparties/SDL3/install'
        key: ${{ runner.os }}-x64-sdl3-${{ env.sdl3-branch }}-v1

    - name: Checkout SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'libsdl-org/SDL'
        path: 'thirdparties/SDL3'
        ref: '${{ env.sdl3-branch }}'

    - name: Configure and install SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/SDL3
      run: |
        cmake -B ./build `
        -DSDL_TESTS=OFF `
        -DSDL_EXAMPLES=OFF `
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/SDL3/install'
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    ###
    # Vulkan headers (the renderer only uses the headers: Vulkan is loaded
    # when the game runs, through SDL)
    ###

    - name: Cache Vulkan-Headers
      id: cache-vulkan-headers
      uses: actions/cache@v4
      with:
        path: 'thirdparties/Vulkan-Headers/install'
        key: ${{ runner.os }}-vulkan-headers-${{ env.vulkan-headers-version }}-v1

    - name: Checkout Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'KhronosGroup/Vulkan-Headers'
        path: 'thirdparties/Vulkan-Headers'
        ref: '${{ env.vulkan-headers-version }}'

    - name: Configure and install Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/Vulkan-Headers
      run: |
        cmake -B ./build `
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/Vulkan-Headers/install'
        cmake --install ./build

    ###
    # OpenAL (as in moharena-windows.yml; its license is kept with the
    # install, so the cache key is this workflow's own)
    ###

    - name: Cache OpenAL
      id: cache-openal-soft
      uses: actions/cache@v4
      with:
        path: 'thirdparties/soft-oal/install'
        key: ${{ runner.os }}-x64-openal-soft-${{ env.openal-soft-branch }}-reloaded-v1

    - name: Checkout soft-oal
      if: steps.cache-openal-soft.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'kcat/openal-soft'
        path: 'thirdparties/soft-oal'
        ref: '${{ env.openal-soft-branch }}'

    # Statically link the CRT runtime into OAL as a workaround to prevent crashes
    - name: Configure and install soft-oal
      if: steps.cache-openal-soft.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/soft-oal
      run: |
        cmake -B ./build `
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/soft-oal/install' `
        -DALSOFT_BUILD_ROUTER=OFF `
        -DALSOFT_REQUIRE_WINMM=ON `
        -DALSOFT_REQUIRE_DSOUND=ON `
        -DALSOFT_REQUIRE_WASAPI=ON `
        -DCMAKE_C_FLAGS_RELEASE="/MT /O2 /Ob2 /DNDEBUG" `
        -DCMAKE_CXX_FLAGS_RELEASE="/MT /O2 /Ob2 /DNDEBUG" `
        -DCMAKE_C_FLAGS_MINSIZEREL="/MT /O2 /Ob2 /DNDEBUG" `
        -DCMAKE_CXX_FLAGS_MINSIZEREL="/MT /O1 /Ob1 /DNDEBUG" `
        -DCMAKE_C_FLAGS_RELWITHDEBINFO="/MT /Zi /O2 /Ob1 /DNDEBUG" `
        -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="/MT /Zi /O2 /Ob1 /DNDEBUG"
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release
        # soft-oal names its binary OpenAL32 even in 64-bit
        Rename-Item -Path '.\install\bin\OpenAL32.dll' -NewName 'OpenAL64.dll'
        Copy-Item 'COPYING' -Destination '.\install\COPYING'

    ###
    # Project
    ###

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: CMake Settings
      run: |
        echo "CMAKE_PARAM= `
        --log-level=VERBOSE `
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' `
        -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=true `
        -DGIT_REVISION_BUILD_NUMBER=${{ github.run_number }} `
        -DBISON_EXECUTABLE='${{github.workspace}}/thirdparties/winflexbison-install/win_bison.exe' `
        -DFLEX_EXECUTABLE='${{github.workspace}}/thirdparties/winflexbison-install/win_flex.exe' `
        -DUSE_INTERNAL_SDL=OFF `
        -DSDL3_DIR='${{github.workspace}}/thirdparties/SDL3/install/cmake' `
        -DVulkanHeaders_DIR='${{github.workspace}}/thirdparties/Vulkan-Headers/install/share/cmake/VulkanHeaders' `
        -DOPENAL_LIBRARY='${{github.workspace}}/thirdparties/soft-oal' `
        -DOPENAL_INCLUDE_DIR='${{github.workspace}}/thirdparties/soft-oal/install/include/AL' `
        -DBUILD_RENDERER_VULKAN=ON `
        -DUSE_RENDERER_DLOPEN=OFF `
        -DMOHARENA=ON `
        -DBUILD_TESTING=OFF `
        -DPRODUCT_VERSION_STAGE='${{ env.RELEASE_STAGE }}'".Replace("`r", "").Replace("`n", "") >> $env:GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Install
      working-directory: ${{github.workspace}}
      # Install to the directory defined in CMAKE_INSTALL_PREFIX
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        New-Item -ItemType Directory '${{github.workspace}}/package'
        Copy-Item '${{github.workspace}}/thirdparties/SDL3/install/bin/*.dll' -Destination '${{github.workspace}}/package'
        Copy-Item '${{github.workspace}}/thirdparties/soft-oal/install/bin/*.dll' -Destination '${{github.workspace}}/package'
        if (Test-Path ${{github.workspace}}/install/bin) { Copy-Item '${{github.workspace}}/install/bin/*' -Include '*.dll','*.exe','*.pdb','*.txt' -Destination '${{github.workspace}}/package' }
        # the Omaha mixer's headphone set and hit sounds
        if (Test-Path ${{github.workspace}}/install/bin/main) { Copy-Item '${{github.workspace}}/install/bin/main' -Destination '${{github.workspace}}/package' -Recurse }
        if (Test-Path ${{github.workspace}}/install/lib) { Copy-Item '${{github.workspace}}/install/lib/*' -Include '*.dll','*.exe','*.pdb' -Destination '${{github.workspace}}/package' }
        # the renderer is in the exe: a renderer library here would be a mistake
        if (Get-ChildItem '${{github.workspace}}/package/renderer_*' -ErrorAction SilentlyContinue) { throw "A renderer library was built; the renderer belongs in openmohaa.exe" }

    # The license, the written source offer with this build's versions, the
    # notices of the work by others, the licenses of the libraries, and the
    # SHA-256 of every exe and DLL (the launcher accepts only these exes).
    - name: MoH Arena files
      working-directory: ${{github.workspace}}
      run: |
        $Package = '${{github.workspace}}/package'
        if (-not (Test-Path "$Package/openmohaa.exe")) { throw "openmohaa.exe is missing from the package" }
        if (-not (Test-Path "$Package/OpenAL64.dll")) { throw "OpenAL64.dll is missing from the package" }
        Copy-Item 'source/COPYING.txt' -Destination $Package
        Copy-Item 'source/misc/moharena/THIRD-PARTY-reloaded.txt' -Destination "$Package/THIRD-PARTY.txt"
        Copy-Item 'source/misc/release/licenses' -Destination $Package -Recurse
        Remove-Item "$Package/licenses/mohlauncher" -Recurse
        New-Item -ItemType Directory "$Package/licenses/openal-soft" | Out-Null
        Copy-Item 'thirdparties/soft-oal/install/COPYING' -Destination "$Package/licenses/openal-soft/COPYING"
        $Offer = Get-Content -Raw 'source/misc/moharena/SOURCE-OFFER-reloaded.txt'
        $Offer = $Offer.Replace('@PROGRAM@', 'openmohaa.exe')
        $Offer += "`nBuild`n"
        $Offer += "  OpenMoH Arena commit: ${{ github.sha }} (mohaa-reloaded)`n"
        $Offer += "  Platform: windows-x64`n"
        $Offer += "  SDL3: ${{ env.sdl3-branch }}`n"
        $Offer += "  OpenAL Soft: ${{ env.openal-soft-branch }}`n"
        $Offer += "  Vulkan-Headers: ${{ env.vulkan-headers-version }}`n"
        Set-Content -Path "$Package/SOURCE-OFFER.txt" -Value $Offer -NoNewline
        $Hashes = @(Get-ChildItem -Path "$Package/*" -File -Include '*.exe','*.dll' | Sort-Object Name | ForEach-Object {
          "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
        })
        Set-Content -Path "$Package/SHA256SUMS.txt" -Value $Hashes
        echo "### windows-x64 (Reloaded) SHA-256" >> $env:GITHUB_STEP_SUMMARY
        echo '```' >> $env:GITHUB_STEP_SUMMARY
        $Hashes | ForEach-Object { echo $_ >> $env:GITHUB_STEP_SUMMARY }
        echo '```' >> $env:GITHUB_STEP_SUMMARY

    ###
    # Artifact
    ###

    - uses: actions/upload-artifact@v4
      with:
        name: moharena-reloaded-windows-x64
        if-no-files-found: error
        compression-level: 9
        path: |
          ${{github.workspace}}/package
          !${{github.workspace}}/package/**/*.pdb

    - uses: actions/upload-artifact@v4
      with:
        name: moharena-reloaded-windows-x64-pdb
        if-no-files-found: error
        compression-level: 9
        path: |
          ${{github.workspace}}/package
