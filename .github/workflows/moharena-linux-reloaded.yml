##########################
#
# Added in MoH Arena
#
# The Linux x64 client of the mohaa-reloaded branch, as a tarball:
# MoHAA-Reloaded's Vulkan renderer linked into the game, SDL3 and OpenAL Soft
# (loaded when the game runs, s_backend openal; found next to the game
# through the $ORIGIN run path). The same toolchain as
# shared-build-linux.yml: Ubuntu 22.04 for glibc 2.34, clang. No dedicated
# server (moharena-linux-server.yml builds the servers), no Rust launcher
# and no test programs. The debug info goes in an artifact of its own.
#
##########################
name: "MoH Arena Reloaded Linux Build"

on:
  workflow_dispatch:
  push:
    branches:
      - 'mohaa-reloaded'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: RelWithDebInfo
  RELEASE_STAGE: ${{ vars.RELEASE_STAGE || 'unstable' }}

jobs:
  build:
    name: "MoH Arena Reloaded linux-x64"
    runs-on: ubuntu-22.04
    env:
        openal-soft-branch: '1.24.3'
        sdl3-branch: 'release-3.4.18'
        vulkan-headers-version: 'v1.4.341'
        package-name: 'openmoh-arena-reloaded-linux-x64'

    steps:
    ###
    # Packages
    ###

    # Plain apt-get, as in unit-testing.yml: when apt failed,
    # awalsh128/cache-apt-pkgs-action still saved an empty package cache.
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get install -y flex bison ninja-build cmake clang libpulse-dev portaudio19-dev libasound2-dev libjack-dev libpipewire-0.3-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libegl1-mesa-dev libdrm-dev libgbm-dev libudev-dev

    - name: Settings
      working-directory: ${{github.workspace}}
      run: |
        echo "CMAKE_GENERATOR=Ninja Multi-Config" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS='--target=x86_64-linux-gnu'" >> $GITHUB_ENV
        echo "CXXFLAGS='--target=x86_64-linux-gnu'" >> $GITHUB_ENV

    ###
    # SDL3
    ###

    - name: Cache SDL3
      id: cache-sdl3
      uses: actions/cache@v4
      with:
        path: 'thirdparties/SDL3/install'
        key: ${{ runner.os }}-amd64-sdl3-${{ env.sdl3-branch }}-v1

    - name: Checkout SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'libsdl-org/SDL'
        path: 'thirdparties/SDL3'
        ref: '${{ env.sdl3-branch }}'

    - name: Configure and install SDL3
      if: steps.cache-sdl3.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/SDL3
      run: |
        cmake -B ./build \
        -DCMAKE_BUILD_TYPE=Release \
        -DSDL_TESTS=OFF \
        -DSDL_EXAMPLES=OFF \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/SDL3/install'
        # SDL leaves out a video driver whose development files are missing:
        # the package's SDL must open windows under X11 and Wayland
        for driver in X11 WAYLAND; do
          grep -q "^#define SDL_VIDEO_DRIVER_$driver 1" ./build/include-config-release/build_config/SDL_build_config.h || { echo "SDL3 without its $driver video driver"; exit 1; }
        done
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release

    ###
    # Vulkan headers (the renderer only uses the headers: Vulkan is loaded
    # when the game runs, through SDL)
    ###

    - name: Cache Vulkan-Headers
      id: cache-vulkan-headers
      uses: actions/cache@v4
      with:
        path: 'thirdparties/Vulkan-Headers/install'
        key: ${{ runner.os }}-vulkan-headers-${{ env.vulkan-headers-version }}-v1

    - name: Checkout Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'KhronosGroup/Vulkan-Headers'
        path: 'thirdparties/Vulkan-Headers'
        ref: '${{ env.vulkan-headers-version }}'

    - name: Configure and install Vulkan-Headers
      if: steps.cache-vulkan-headers.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/Vulkan-Headers
      run: |
        cmake -B ./build \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/Vulkan-Headers/install'
        cmake --install ./build

    ###
    # OpenAL Soft, shared. Its sound backends (PipeWire, PulseAudio, ALSA,
    # JACK) are loaded when it runs, so it needs none of them installed.
    ###

    - name: Cache OpenAL
      id: cache-openal-soft
      uses: actions/cache@v4
      with:
        path: 'thirdparties/soft-oal/install'
        key: ${{ runner.os }}-amd64-openal-soft-${{ env.openal-soft-branch }}-reloaded-v1

    - name: Checkout soft-oal
      if: steps.cache-openal-soft.outputs.cache-hit != 'true'
      uses: actions/checkout@v4
      with:
        repository: 'kcat/openal-soft'
        path: 'thirdparties/soft-oal'
        ref: '${{ env.openal-soft-branch }}'

    - name: Configure and install soft-oal
      if: steps.cache-openal-soft.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/thirdparties/soft-oal
      run: |
        cmake -B ./build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/thirdparties/soft-oal/install' \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DALSOFT_UTILS=OFF \
        -DALSOFT_NO_CONFIG_UTIL=ON \
        -DALSOFT_EXAMPLES=OFF \
        -DALSOFT_REQUIRE_PIPEWIRE=ON \
        -DALSOFT_REQUIRE_PULSEAUDIO=ON \
        -DALSOFT_REQUIRE_ALSA=ON
        cmake --build ./build --config Release --parallel
        cmake --install ./build --config Release
        cp COPYING ./install/COPYING

    ###
    # Project
    ###

    - uses: actions/checkout@v4
      with:
        path: 'source'

    - name: CMake Settings
      run: |
        echo "CMAKE_PARAM=--log-level=VERBOSE \
        -DCMAKE_INSTALL_PREFIX='${{github.workspace}}/install' \
        -DUSE_INTERNAL_SDL=OFF \
        -DSDL3_DIR='${{github.workspace}}/thirdparties/SDL3/install/lib/cmake/SDL3' \
        -DVulkanHeaders_DIR='${{github.workspace}}/thirdparties/Vulkan-Headers/install/share/cmake/VulkanHeaders' \
        -DOPENAL_LIBRARY='${{github.workspace}}/thirdparties/soft-oal/install/lib/libopenal.so' \
        -DOPENAL_INCLUDE_DIR='${{github.workspace}}/thirdparties/soft-oal/install/include' \
        -DBUILD_RENDERER_VULKAN=ON \
        -DUSE_RENDERER_DLOPEN=OFF \
        -DMOHARENA=ON \
        -DBUILD_TESTING=OFF \
        -DGIT_REVISION_BUILD_NUMBER=${{ github.run_number }} \
        -DPRODUCT_VERSION_STAGE='${{ env.RELEASE_STAGE }}'" >> $GITHUB_ENV

    - name: Configure CMake
      working-directory: ${{github.workspace}}
      run: |
        cmake -B ./build ${{ env.CMAKE_PARAM }} ./source

    - name: Build
      working-directory: ${{github.workspace}}
      run: |
        cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel

    - name: Install
      working-directory: ${{github.workspace}}
      # Install to the directory defined in CMAKE_INSTALL_PREFIX
      run: |
        cmake --install ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
        Package='${{github.workspace}}/package/${{ env.package-name }}'
        mkdir -p "$Package"
        # cp -L: the libraries under the names the game and the loader ask for
        cp -L ${{github.workspace}}/thirdparties/SDL3/install/lib/libSDL3.so.0 "$Package/"
        cp -L ${{github.workspace}}/thirdparties/soft-oal/install/lib/libopenal.so.1 "$Package/"
        if [ -d ${{github.workspace}}/install/bin ]; then cp -r ${{github.workspace}}/install/bin/openmohaa/. "$Package"; fi
        if [ -d ${{github.workspace}}/install/lib ]; then cp -r ${{github.workspace}}/install/lib/openmohaa/. "$Package"; fi
        # the client only: the servers come from moharena-linux-server.yml
        rm -f "$Package/omohaaded"
        # the renderer is in the game: a renderer library here would be a mistake
        if ls "$Package"/renderer_* >/dev/null 2>&1; then echo "A renderer library was built; the renderer belongs in openmohaa"; exit 1; fi

    # The debug info of the game and its modules, kept apart so the tarball
    # stays small; each program keeps a link to its .debug file.
    - name: Split the debug info
      working-directory: ${{github.workspace}}/package/${{ env.package-name }}
      run: |
        Debug='${{github.workspace}}/debug'
        mkdir -p "$Debug"
        for f in openmohaa cgame.so game.so; do
          objcopy --only-keep-debug "$f" "$Debug/$f.debug"
          objcopy --strip-debug --add-gnu-debuglink="$Debug/$f.debug" "$f"
        done

    # The license, the written source offer with this build's versions, the
    # notices of the work by others, the licenses of the libraries, and the
    # SHA-256 of the game, its launchers and its libraries.
    - name: MoH Arena files
      working-directory: ${{github.workspace}}
      run: |
        Package='${{github.workspace}}/package/${{ env.package-name }}'
        [ -x "$Package/openmohaa" ] || { echo "openmohaa is missing from the package"; exit 1; }
        [ -e "$Package/libopenal.so.1" ] || { echo "libopenal.so.1 is missing from the package"; exit 1; }
        cp source/COPYING.txt "$Package/"
        cp source/misc/moharena/THIRD-PARTY-reloaded.txt "$Package/THIRD-PARTY.txt"
        cp -R source/misc/release/licenses "$Package/"
        rm -r "$Package/licenses/mohlauncher"
        mkdir -p "$Package/licenses/openal-soft"
        cp thirdparties/soft-oal/install/COPYING "$Package/licenses/openal-soft/COPYING"
        {
          sed 's/@PROGRAM@/openmohaa/' source/misc/moharena/SOURCE-OFFER-reloaded.txt
          printf '\nBuild\n'
          printf '  OpenMoH Arena commit: %s (mohaa-reloaded)\n' '${{ github.sha }}'
          printf '  Platform: linux-x64\n'
          printf '  SDL3: %s\n' '${{ env.sdl3-branch }}'
          printf '  OpenAL Soft: %s\n' '${{ env.openal-soft-branch }}'
          printf '  Vulkan-Headers: %s\n' '${{ env.vulkan-headers-version }}'
        } > "$Package/SOURCE-OFFER.txt"
        (cd "$Package" && sha256sum openmohaa launch_openmohaa_* *.so *.so.* | sort -k2) > sums.txt
        mv sums.txt "$Package/SHA256SUMS.txt"
        echo "### linux-x64 (Reloaded) SHA-256" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat "$Package/SHA256SUMS.txt" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    # A tarball, so the programs keep their execute permission (an artifact
    # alone drops it)
    - name: Tarball
      working-directory: ${{github.workspace}}/package
      run: |
        tar -czf '${{github.workspace}}/${{ env.package-name }}.tar.gz' --owner=0 --group=0 '${{ env.package-name }}'
        (cd '${{github.workspace}}' && sha256sum '${{ env.package-name }}.tar.gz')

    ###
    # Artifacts
    ###

    - uses: actions/upload-artifact@v4
      with:
        name: moharena-reloaded-linux-x64
        if-no-files-found: error
        compression-level: 0
        path: ${{github.workspace}}/${{ env.package-name }}.tar.gz

    - uses: actions/upload-artifact@v4
      with:
        name: moharena-reloaded-linux-x64-debug
        if-no-files-found: error
        compression-level: 9
        path: ${{github.workspace}}/debug
